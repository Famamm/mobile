name: fleetops_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev
resolution: workspace 
version: 3.0.3+6

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  
  core:
    path: ../../packages/core

  shared:
    path: ../../packages/shared

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  flutter_bloc: ^9.1.1
  gap: ^3.0.1
  image_picker: ^1.2.2
  dotted_border: ^2.1.0
  google_places_flutter: ^2.1.1
  shared_preferences: ^2.5.5
  get_it: ^7.7.0
  dartz: ^0.10.1
  equatable: ^2.0.5
  dio: ^5.4.0
  geolocator: ^14.0.2
  skeletonizer: ^2.1.3
  geocoding: ^4.0.0
  http: ^1.6.0
  flutter_map: ^8.3.2
  fl_chart: ^1.2.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  rename_app: ^1.6.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Logo FleetOps4.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/Logo FleetOps1.png
    - assets/images/Logo FleetOps2.png
    - assets/images/Logo FleetOps3.png
    - assets/images/Logo FleetOps4.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:

  # fonts:
  #   - family: Plus Jakarta Sans
  #     fonts:
  #       - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
  #         weight: 200
  #       - asset: assets/fonts/PlusJakartaSans-Light.ttf
  #         weight: 300
  #       - asset: assets/fonts/PlusJakartaSans-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/PlusJakartaSans-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/PlusJakartaSans-Bold.ttf
  #         weight: 700
  #       - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
  #         weight: 800

  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
